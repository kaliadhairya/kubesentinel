name: KubeSentinel CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test Suite (35 Invariant & Regression Tests)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: kubesentinel
          POSTGRES_PASSWORD: sentinel_secret
          POSTGRES_DB: kubesentinel_db
        ports:
          - 5438:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov httpx

      - name: Run Test Suite (Offline Cassette Replay)
        env:
          DATABASE_URL: "postgresql://kubesentinel:sentinel_secret@localhost:5438/kubesentinel_db"
          CASSETTE_MODE: "replay"
          K8S_MOCK_MODE: "true"
          PROMETHEUS_MOCK_MODE: "true"
        run: |
          pytest -v tests/
