# KubeSentinel Actuator Identity (Gated Mutator Pod)
# Namespace-scoped mutation Role. Bound strictly to opted-in application namespaces.
# System namespaces (kube-system, cert-manager, etc.) are cryptographically unreachable.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubesentinel-actuator
  namespace: kubesentinel-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kubesentinel-actuator-role
  namespace: production
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale", "statefulsets", "statefulsets/scale"]
    verbs: ["get", "patch", "update"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kubesentinel-actuator-binding-production
  namespace: production
subjects:
  - kind: ServiceAccount
    name: kubesentinel-actuator
    namespace: kubesentinel-system
roleRef:
  kind: Role
  name: kubesentinel-actuator-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kubesentinel-actuator-role
  namespace: staging
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale", "statefulsets", "statefulsets/scale"]
    verbs: ["get", "patch", "update"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kubesentinel-actuator-binding-staging
  namespace: staging
subjects:
  - kind: ServiceAccount
    name: kubesentinel-actuator
    namespace: kubesentinel-system
roleRef:
  kind: Role
  name: kubesentinel-actuator-role
  apiGroup: rbac.authorization.k8s.io
