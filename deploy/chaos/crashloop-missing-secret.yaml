apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: production
  labels:
    app: payment-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
    spec:
      containers:
      - name: payment
        image: busybox:1.36
        command: ["sh", "-c", "echo 'Connecting to Stripe vault...'; cat /etc/secrets/stripe-token; sleep 2"]
        volumeMounts:
        - name: stripe-credentials
          mountPath: /etc/secrets
          readOnly: true
      volumes:
      - name: stripe-credentials
        secret:
          secretName: non-existent-stripe-secret
          optional: false
